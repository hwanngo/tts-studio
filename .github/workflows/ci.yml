name: Continuous integration

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A hung test must not exhaust the monthly hosted-runner allowance. Normal
    # release-smoke runs complete in minutes; 30 minutes leaves headroom while
    # bounding every OS in the matrix.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is the public ARM64 macOS runner; the other two entries are
        # the x64 Linux and Windows runners used for release coverage.
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS ARM64
            os: macos-14
          - name: Windows x64
            os: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.10'
          enable-cache: true
          # uv's cache is keyed from the checked-in Python lockfiles. No
          # dependency is installed from an untracked or floating resolution.
          cache-dependency-glob: |
            uv.lock
            packages/protocol/pyproject.toml
            packages/worker-sdk/pyproject.toml
            workers/*/uv.lock
            workers/*/pyproject.toml

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        shell: bash
        run: |
          python --version
          uv --version
          pnpm --version
          uv run python --version

      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups

      - name: Install locked Web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm --dir web test -- --run

      - name: Check frontend types
        run: pnpm --dir web exec tsc --noEmit

      - name: Check frontend locale parity
        run: pnpm --dir web locale:check

      - name: Check Python formatting and lint
        run: uv run ruff check .

      - name: Check Python type diagnostics against baseline
        run: uv run python scripts/check_mypy_baseline.py

      - name: Check generated protocol
        run: uv run python scripts/check_protocol.py

      - name: Check generated OpenAPI client
        run: uv run python scripts/check_openapi.py

      - name: Build frontend
        run: pnpm --dir web build

      - name: Run deterministic Python tests
        if: runner.os == 'macOS'
        # The marker expression keeps future opt-in hardware/network suites
        # out of this credential-free release check while running all normal
        # unit and integration coverage.
        run: uv run pytest -m "not e2e and not hardware and not network"

      - name: Build distribution packages
        # This exercises the repository's production build path, including
        # the Web UI, without publishing or uploading platform artifacts.
        run: uv run python scripts/build_distribution.py --out-dir dist --include-test-adapters

      - name: Check runtime and service CLI help
        run: |
          uv run tts runtime --help
          uv run tts service --help
