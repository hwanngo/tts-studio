name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: '3.14'

jobs:
  assurance:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan tracked text for high-confidence secrets
        run: python3 scripts/scan_secrets.py
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.10'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          uv sync --locked --all-groups
          pnpm --dir web install --frozen-lockfile
      - name: Check Python formatting and lint
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
      - name: Check Python types and generated contracts
        run: |
          uv run --frozen mypy --platform linux
          uv run --frozen python scripts/sync_release_versions.py --check
          uv run --frozen python scripts/check_protocol.py
          uv run --frozen python scripts/check_openapi.py
      - name: Check Web types, locales, and unit tests
        run: |
          pnpm --dir web check
          pnpm --dir web test -- --run
      - name: Run deterministic Core coverage
        # Installed artifact checks run below; avoid rebuilding Web assets in
        # the older full-distribution fixtures during coverage collection.
        run: >-
          uv run --frozen pytest -q
          -m "not e2e and not hardware and not network"
          --ignore=tests/packaging/test_wheel.py
          --ignore=tests/packaging/test_tool_install.py
          --ignore=tests/integration/test_phase3_generation_artifact.py
          --cov=tts_studio --cov-report=term:skip-covered --cov-report=xml
      - name: Run every locked Worker suite
        run: |
          uv run --project workers/fake --locked pytest workers/fake/tests -q
          uv run --project workers/openai_compatible --locked pytest workers/openai_compatible/tests -q
          uv run --project workers/vieneu --locked pytest workers/vieneu/tests -q
      - name: Install Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Run Chromium browser tests
        run: pnpm --dir web test:browser
      - name: Build release artifacts once, including production Web assets
        run: |
          uv run --frozen python scripts/build_distribution.py --out-dir dist --include-test-adapters
          uv export --frozen --no-dev --no-emit-workspace --format requirements-txt --output-file dist/core-requirements.txt
      - name: Exercise installed Core and isolated fake Worker workflows
        env:
          TTS_STUDIO_TEST_DIST_DIR: ${{ github.workspace }}/dist
        run: >-
          uv run --frozen pytest -q tests/packaging/test_wheel.py
          tests/packaging/test_tool_install.py
          tests/integration/test_phase3_generation_artifact.py
      - name: Share release artifacts with platform smokes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 3
      - name: Preserve coverage and browser failure evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-results
          path: |
            coverage.xml
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  release-smoke:
    name: Smoke (${{ matrix.os }})
    needs: assurance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Fetch the tested artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: Install locked test dependencies
        run: uv sync --locked --all-groups
      - name: Run deterministic platform-safe Core tests
        # A folded scalar is one command in both PowerShell and Bash.
        run: >-
          uv run --frozen pytest -q
          tests/config tests/settings tests/client tests/openapi tests/runtime
          tests/storage/test_migrations.py
          tests/generation/test_audio.py
          tests/generation/test_registry.py
          tests/cli/test_cli.py tests/cli/test_service_cli.py tests/cli/test_runtime_cli.py
          tests/workers/test_windows_containment.py
      - name: Install artifacts in a clean environment and exercise CLI, API, and Web
        run: uv run --frozen python scripts/ci_artifact_smoke.py --dist-dir dist
