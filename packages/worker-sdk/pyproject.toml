[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "tts-studio-worker-sdk"
version = "0.1.0"
description = "Shared authentication and server lifecycle helpers for TTS Studio workers"
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.83.1",
    "tts-studio-protocol==0.1.0",
]

[tool.uv.sources]
tts-studio-protocol = { workspace = true }
