syntax = "proto3";

package tts_studio.engine.v1;

service EngineWorker {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc ValidateModel(ValidateModelRequest) returns (ValidateModelResponse);
  rpc ValidateReference(ValidateReferenceRequest) returns (ValidateReferenceResponse);
  rpc DownloadModel(DownloadModelRequest) returns (stream DownloadModelEvent);
  rpc LoadModel(LoadModelRequest) returns (LoadModelResponse);
  rpc UnloadModel(UnloadModelRequest) returns (UnloadModelResponse);
  rpc ListVoices(ListVoicesRequest) returns (ListVoicesResponse);
  rpc Align(AlignRequest) returns (AlignResponse);
  rpc Synthesize(SynthesizeRequest) returns (stream SynthesisEvent);
}

enum DownloadPhase {
  DOWNLOAD_PHASE_UNSPECIFIED = 0;
  DOWNLOAD_PHASE_DOWNLOADING = 1;
  DOWNLOAD_PHASE_VERIFYING = 2;
  DOWNLOAD_PHASE_FINALIZING = 3;
}

enum SampleFormat {
  UNSPECIFIED = 0;
  S16LE = 1;
}

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message Capability {
  string name = 1;
  bool supported = 2;
}

message DescribeRequest {}

message DescribeResponse {
  ProtocolVersion protocol = 1;
  string engine_id = 2;
  string engine_version = 3;
  repeated Capability capabilities = 4;
  uint32 max_concurrency = 5;
  AlignmentCapability alignment = 6;
}

message AlignmentCapability {
  repeated string units = 1;
  repeated string languages = 2;
  string aligner = 3;
}

message HealthRequest {}

message HealthResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STARTING = 1;
    READY = 2;
    DEGRADED = 3;
  }

  Status status = 1;
  string message = 2;
}

message ModelVariant {
  string id = 1;
  string label = 2;
}

message CompatibilityEvidence {
  string code = 1;
  string message = 2;
}

message WorkerError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  map<string, string> details = 4;
}

message ValidateModelRequest {
  string repository_id = 1;
  optional string requested_revision = 2;
}

message ValidateModelResponse {
  string repository_id = 1;
  optional string requested_revision = 2;
  optional string resolved_commit = 3;
  bool compatible = 4;
  string engine_id = 5;
  string engine_version = 6;
  repeated string required_files = 7;
  repeated ModelVariant available_variants = 8;
  optional uint64 estimated_bytes = 9;
  repeated CompatibilityEvidence evidence = 10;
  WorkerError error = 11;
}

message DownloadModelRequest {
  string repository_id = 1;
  string resolved_commit = 2;
  string variant = 3;
  string staging_destination = 4;
}

message ManifestFile {
  string relative_path = 1;
  uint64 byte_size = 2;
  string sha256 = 3;
}

message ModelManifest {
  string repository_id = 1;
  string resolved_commit = 2;
  string variant = 3;
  repeated ManifestFile files = 4;
  uint64 byte_size = 5;
}

message DownloadProgress {
  uint64 sequence = 1;
  DownloadPhase phase = 2;
  uint64 bytes_downloaded = 3;
  optional uint64 total_bytes = 4;
  string message = 5;
  repeated string warnings = 6;
}

message DownloadModelEvent {
  oneof payload {
    DownloadProgress progress = 1;
    ModelManifest manifest = 2;
    WorkerError error = 3;
  }
}

message LoadModelRequest {
  string model_id = 1;
  string cache_path = 2;
  string variant = 3;
}

message LoadModelResponse {
  bool loaded = 1;
  WorkerError error = 2;
}

message UnloadModelRequest {
  string model_id = 1;
}

message UnloadModelResponse {
  bool unloaded = 1;
  WorkerError error = 2;
}

message ListVoicesRequest {
  string model_id = 1;
}

message PresetVoice {
  string id = 1;
  string label = 2;
  repeated string capabilities = 3;
}

message ListVoicesResponse {
  repeated PresetVoice voices = 1;
  WorkerError error = 2;
}

message ReferenceAudio {
  // Core-owned path relative to the Worker's managed data root.
  string reference_path = 1;
  optional string transcript = 2;
}

message ValidateReferenceRequest {
  string model_id = 1;
  string reference_path = 2;
  optional string transcript = 3;
}

message ReferenceMetadata {
  uint32 sample_rate_hz = 1;
  uint32 channels = 2;
  uint64 duration_ms = 3;
  uint64 byte_size = 4;
  string container = 5;
}

message ValidateReferenceResponse {
  bool valid = 1;
  ReferenceMetadata metadata = 2;
  repeated CompatibilityEvidence evidence = 3;
  WorkerError error = 4;
}

message AlignmentUnit {
  string text = 1;
  uint32 source_start = 2;
  uint32 source_end = 3;
  uint64 start_frames = 4;
  uint64 end_frames = 5;
  float confidence = 6;
  bool estimated = 7;
}

message AlignmentResult {
  uint32 schema_version = 1;
  string transcript = 2;
  uint32 sample_rate_hz = 3;
  uint64 total_frames = 4;
  string unit = 5;
  string aligner = 6;
  repeated AlignmentUnit units = 7;
}

message AlignRequest {
  string model_id = 1;
  string audio_path = 2;
  string transcript = 3;
}

message AlignResponse {
  AlignmentResult result = 1;
  WorkerError error = 2;
}

message ProviderConfig {
  string base_url = 1;
  string model = 2;
  string api_key = 3;
}

message SynthesisOptions {
  optional float speed = 1;
  optional float pitch = 2;
  optional float volume = 3;
}

message SynthesizeRequest {
  string model_id = 1;
  oneof voice_source {
    string voice_id = 2;
    ReferenceAudio reference = 4;
  }
  string text = 3;
  ProviderConfig provider = 5;
  SynthesisOptions options = 6;
}

message AudioHeader {
  uint32 sample_rate_hz = 1;
  uint32 channels = 2;
  SampleFormat sample_format = 3;
}

message PcmChunk {
  uint64 sequence = 1;
  bytes pcm = 2;
}

message SynthesisProgress {
  string message = 1;
  uint64 duration_frames = 2;
}

message SynthesisResult {
  uint64 total_frames = 1;
  uint64 duration_ms = 2;
}

message SynthesisEvent {
  oneof payload {
    AudioHeader header = 1;
    PcmChunk chunk = 2;
    SynthesisProgress progress = 3;
    SynthesisResult result = 4;
    WorkerError error = 5;
  }
}
