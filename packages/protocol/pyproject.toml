[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "tts-studio-protocol"
version = "0.1.0"
description = "Generated worker protocol for TTS Studio"
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.83.1",
    "protobuf>=7.35.1",
    "types-grpcio>=1.83.0.20260730",
    "types-protobuf>=7.35.1.20260827",
]
