[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "tts-studio"
version = "0.1.0"
description = "Local-first text-to-speech studio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "grpcio",
    "httpx",
    "pydantic-settings",
    "protobuf",
    "tts-studio-protocol==0.1.0",
    "typer",
    "uvicorn",
]

[project.scripts]
tts = "tts_studio.cli:app"

[dependency-groups]
dev = [
    "build",
    "grpcio-tools",
    "mypy",
    "mypy-protobuf>=5.1.0",
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.1.0",
    "ruff",
    "tts-studio-worker-sdk==0.1.0",
    "types-grpcio>=1.83.0.20260730",
]

[tool.uv.workspace]
members = ["packages/protocol", "packages/worker-sdk"]

[tool.uv.sources]
tts-studio-protocol = { workspace = true }
tts-studio-worker-sdk = { workspace = true }

[tool.uv.build-backend]
source-include = ["src/tts_studio/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/protocol/tests", "packages/worker-sdk/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"packages/protocol/src/tts_studio_protocol/engine/v1/*_pb2*.py" = ["F401", "I001", "UP009"]
"packages/protocol/src/tts_studio_protocol/engine/v1/*_pb2*.pyi" = ["I001", "UP007", "UP035", "UP036", "UP040"]

[tool.ruff.format]
# Generator-owned output is validated byte-for-byte by the drift checks.
exclude = [
    "packages/protocol/src/tts_studio_protocol/engine/v1/*_pb2*.py",
    "packages/protocol/src/tts_studio_protocol/engine/v1/*_pb2*.pyi",
    "src/tts_studio/generated/api.py",
]

[tool.coverage.run]
source = ["tts_studio"]
relative_files = true

[tool.coverage.report]
fail_under = 83
precision = 2
show_missing = true


[tool.mypy]
python_version = "3.14"
strict = true

files = ["src", "packages/protocol/src", "packages/worker-sdk/src", "workers/fake/src", "workers/openai_compatible/src", "workers/vieneu/src"]

# These SDKs live only in VieNeu's locked environment. Check all adapter code,
# while treating the external numerical/audio/model boundaries as untyped.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "soundfile", "huggingface_hub", "huggingface_hub.*", "vieneu", "vieneu.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.tts-studio.openapi]
renderer = "tts-studio-openapi-v1"
output = "web/src/generated/api.ts"
