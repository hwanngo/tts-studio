[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "tts-studio-openai-compatible-worker"
version = "0.1.0"
description = "Isolated OpenAI-compatible remote speech Worker for TTS Studio"
requires-python = ">=3.14"
dependencies = [
    "tts-studio-protocol",
    "tts-studio-worker-sdk",
]

[project.scripts]
tts-studio-openai-compatible-worker = "tts_studio_openai_worker.main:main"

[tool.uv.sources]
tts-studio-protocol = { path = "../../packages/protocol", editable = true }
tts-studio-worker-sdk = { path = "../../packages/worker-sdk", editable = true }

[tool.uv.build-backend]
module-name = "tts_studio_openai_worker"
