# This deliberately small, high-confidence scanner is repository-owned. It
# scans only tracked text files and makes no network requests. Security
# maintainers own rule changes and documented false-positive review.

[scan]
max_file_bytes = 1048576

[[rule]]
id = "private-key"
description = "PEM private-key header"
pattern = "-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----"

[[rule]]
id = "github-token"
description = "GitHub personal or fine-grained access token"
pattern = "(?:gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{82,255})"

[[rule]]
id = "openai-api-key"
description = "OpenAI API key"
pattern = "sk-(?:proj-)?[A-Za-z0-9_-]{20,}"

[[rule]]
id = "aws-access-key-id"
description = "AWS access key ID"
pattern = "(?:AKIA|ASIA)[0-9A-Z]{16}"

[[rule]]
id = "assigned-service-secret"
description = "Assigned API key, secret, or access token"
pattern = "(?i)\\b(?:api[_-]?key|secret(?:_key)?|access[_-]?token)[\"']?\\s*[:=]\\s*[\"'](?=[A-Za-z0-9._~+/=-]{20,}[\"'])(?=[A-Za-z0-9._~+/=-]*[A-Za-z])(?=[A-Za-z0-9._~+/=-]*\\d)[A-Za-z0-9._~+/=-]{20,}[\"']"
